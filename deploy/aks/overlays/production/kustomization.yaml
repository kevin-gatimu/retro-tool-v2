apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retro-tool-production

resources:
  - ../../base

# Patch Namespace name to match the production namespace
patches:
  - target:
      kind: Namespace
      name: retro-tool
    patch: |-
      - op: replace
        path: /metadata/name
        value: retro-tool-production

  # Replace base ingress hosts with production domains
  # Update hosts below to match your actual production domain before deploying
  - target:
      kind: Ingress
      name: retro-tool-ingress
    path: patches/ingress.yaml

# Replace image registry with ACR login server for production
# Run: az acr show --name retrotoolproductionacr --query loginServer -o tsv
# Then update the newName fields below
images:
  - name: retro-tool-api
    newName: retrotoolproductionacr.azurecr.io/retro-tool-api
    newTag: latest
  - name: retro-tool-ui
    newName: retrotoolproductionacr.azurecr.io/retro-tool-ui
    newTag: latest