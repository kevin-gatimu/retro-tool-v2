apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retro-tool-staging

resources:
  - ../../base

# Patch Namespace name to match the staging namespace
patches:
  - target:
      kind: Namespace
      name: retro-tool
    patch: |-
      - op: replace
        path: /metadata/name
        value: retro-tool-staging

  # Replace base ingress hosts with staging subdomains
  # Update hosts below to match your actual staging domain before deploying
  - target:
      kind: Ingress
      name: retro-tool-ingress
    path: patches/ingress.yaml

# Replace image registry with ACR login server for staging
# Run: az acr show --name retrotoolstagingacr --query loginServer -o tsv
# Then update the newName fields below
images:
  - name: retro-tool-api
    newName: retrotoolstagingacr.azurecr.io/retro-tool-api
    newTag: latest
  - name: retro-tool-ui
    newName: retrotoolstagingacr.azurecr.io/retro-tool-ui
    newTag: latest