apiVersion: apps/v1
kind: Deployment
metadata:
  name: retro-tool-api
  namespace: retro-tool
  labels:
    app: retro-tool-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retro-tool-api
  template:
    metadata:
      labels:
        app: retro-tool-api
    spec:
      containers:
        - name: retro-tool-api
          image: retro-tool-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: retro-tool-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retro-tool-api
  namespace: retro-tool
spec:
  selector:
    app: retro-tool-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
