apiVersion: apps/v1
kind: Deployment
metadata:
  name: retro-tool-ui
  namespace: retro-tool
  labels:
    app: retro-tool-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retro-tool-ui
  template:
    metadata:
      labels:
        app: retro-tool-ui
    spec:
      containers:
        - name: retro-tool-ui
          # VITE_* env vars are baked into the image at build time (see Dockerfile ARG/ENV)
          image: retro-tool-ui:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: retro-tool-ui
  namespace: retro-tool
spec:
  selector:
    app: retro-tool-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
