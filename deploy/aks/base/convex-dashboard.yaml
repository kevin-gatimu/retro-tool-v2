apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-dashboard
  namespace: retro-tool
  labels:
    app: convex-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convex-dashboard
  template:
    metadata:
      labels:
        app: convex-dashboard
    spec:
      containers:
        - name: convex-dashboard
          image: ghcr.io/get-convex/convex-dashboard:latest
          ports:
            - containerPort: 6791
          livenessProbe:
            httpGet:
              path: /
              port: 6791
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 6791
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: convex-dashboard
  namespace: retro-tool
spec:
  selector:
    app: convex-dashboard
  ports:
    - name: http
      port: 6791
      targetPort: 6791
