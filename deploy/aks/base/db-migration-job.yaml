# DB Migration Job Template
#
# This is NOT applied via Kustomize. It is used as a reference template
# by the deploy-api.yml GitHub Actions workflow which creates the job
# dynamically via kubectl.
#
# To run a migration manually against an environment:
#
#   NAMESPACE=retro-tool-staging
#   IMAGE=retrotoolstagingacr.azurecr.io/retro-tool-api:staging-latest
#
#   kubectl -n $NAMESPACE apply -f - <<EOF
#   apiVersion: batch/v1
#   kind: Job
#   metadata:
#     name: db-migrate-manual
#     namespace: $NAMESPACE
#   spec:
#     backoffLimit: 0
#     ttlSecondsAfterFinished: 300
#     template:
#       spec:
#         restartPolicy: Never
#         containers:
#           - name: migrate
#             image: $IMAGE
#             command: ["node", "dist/migrate.js"]
#             envFrom:
#               - secretRef:
#                   name: retro-tool-api-secrets
#   EOF
#
#   kubectl -n $NAMESPACE wait --for=condition=complete --timeout=300s job/db-migrate-manual
#   kubectl -n $NAMESPACE logs job/db-migrate-manual
#   kubectl -n $NAMESPACE delete job db-migrate-manual
