# Secret template — DO NOT commit with real values.
# Create secrets using the commands shown in infra/bicep/environments/staging/README.md
#
# This file is for reference only. It shows the exact keys expected by each Deployment.
# It is NOT included in kustomization.yaml.

---
apiVersion: v1
kind: Secret
metadata:
  name: retro-tool-api-secret
  namespace: retro-tool
type: Opaque
stringData:
  DATABASE_URL: "postgresql://appuser:PASSWORD@POSTGRES_FQDN:5432/app_staging?sslmode=require"
  REDIS_URL: "rediss://default:ACCESS_KEY@redis.example.com:6380"
  BETTER_AUTH_SECRET: "REPLACE_WITH_OPENSSL_RAND_BASE64_32"
  BETTER_AUTH_URL: "https://api.staging.yourdomain.com"
  BETTER_AUTH_SESSION_EXPIRES_IN: "604800"
  FRONTEND_URL: "https://app.staging.yourdomain.com"
  ALLOWED_ORIGINS: "https://app.staging.yourdomain.com,https://api.staging.yourdomain.com"
  DEPLOYED_SERVER_URL: "https://api.staging.yourdomain.com"
  ENABLE_CRON_JOBS: "true"
  WEEKLY_DIGEST_SEND_HOUR: "6"
  CONVEX_SYNC_URL: "https://convex-api.staging.yourdomain.com"
  CONVEX_SYNC_ADMIN_KEY: "REPLACE_WITH_CONVEX_ADMIN_KEY"
  VAPID_PUBLIC_KEY: "REPLACE_WITH_VAPID_PUBLIC_KEY"
  VAPID_PRIVATE_KEY: "REPLACE_WITH_VAPID_PRIVATE_KEY"
  VAPID_SUBJECT: "mailto:ops@yourdomain.com"
  RESEND_API_KEY: "REPLACE_WITH_RESEND_API_KEY"
  EMAIL_FROM: "noreply@yourdomain.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: convex-backend-secret
  namespace: retro-tool
type: Opaque
stringData:
  INSTANCE_NAME: "convex-staging"
  INSTANCE_SECRET: "REPLACE_WITH_64_CHAR_HEX_SECRET"
  POSTGRES_URL: "postgresql://convexuser:PASSWORD@POSTGRES_FQDN:5432/convex_staging?sslmode=require"
  DO_NOT_REQUIRE_SSL: "0"
