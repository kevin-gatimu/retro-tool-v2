name: Deploy Convex

on:
  push:
    branches: [main]
    paths:
      - 'convex-backend/**'
      - '.github/workflows/deploy-convex.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-convex-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────── Determine target environment ───────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  # ─── Push Convex functions & update Container Instance ──────────────
  deploy:
    needs: [set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push Convex functions
        working-directory: convex-backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_SYNC_URL }}
        run: npx convex deploy

      - name: Restart Convex Container Instance
        run: |
          ENV="${{ needs.set-env.outputs.environment }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP_API }}"
          CONTAINER_NAME="retro-tool-${ENV}-convex"

          az container restart \
            --resource-group "${RG}" \
            --name "${CONTAINER_NAME}"

      - name: Health check
        run: |
          CONVEX_URL="${{ vars.CONVEX_SYNC_URL }}"
          echo "Checking Convex at ${CONVEX_URL}..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${CONVEX_URL}" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "101" ] || [ "$STATUS" = "426" ]; then
              echo "Convex backend is responding (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 10
          done
          echo "Health check did not pass after 20 attempts — check manually"
          exit 1
