name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      acrLoginServer: ${{ steps.bicep.outputs.acrLoginServer }}
      apiUrl: ${{ steps.bicep.outputs.apiUrl }}
      swaDefaultHostname: ${{ steps.bicep.outputs.swaDefaultHostname }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: az bicep build --file infra/bicep/main.bicep

      - name: What-If preview
        continue-on-error: true
        run: |
          DEPLOYMENT_NAME="main-${{ inputs.environment }}-${{ github.run_id }}"
          az deployment sub what-if \
            --name "${DEPLOYMENT_NAME}" \
            --location ${{ vars.AZURE_LOCATION }} \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName=${{ inputs.environment }} \
              resourceGroupName='${{ vars.AZURE_RESOURCE_GROUP }}' \
              location='${{ vars.AZURE_LOCATION }}' \
              postgresAdminPassword='${{ secrets.POSTGRES_PASSWORD }}'

      - name: Deploy Bicep
        id: bicep
        run: |
          DEPLOYMENT_NAME="main-${{ inputs.environment }}-${{ github.run_id }}"
          OUTPUT=$(az deployment sub create \
            --name "${DEPLOYMENT_NAME}" \
            --location ${{ vars.AZURE_LOCATION }} \
            --template-file infra/bicep/main.bicep \
            --parameters \
              environmentName=${{ inputs.environment }} \
              resourceGroupName='${{ vars.AZURE_RESOURCE_GROUP }}' \
              location='${{ vars.AZURE_LOCATION }}' \
              postgresAdminPassword='${{ secrets.POSTGRES_PASSWORD }}' \
            --query 'properties.outputs' -o json)

          echo "acrLoginServer=$(echo $OUTPUT | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "apiUrl=$(echo $OUTPUT | jq -r '.apiUrl.value')" >> "$GITHUB_OUTPUT"
          echo "swaDefaultHostname=$(echo $OUTPUT | jq -r '.swaDefaultHostname.value')" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ steps.bicep.outputs.apiUrl }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI (SWA) | ${{ steps.bicep.outputs.swaDefaultHostname }} |" >> $GITHUB_STEP_SUMMARY
