name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az bicep build \
            --file infra/bicep/environments/${{ inputs.environment }}/main.bicep

      - name: What-If preview
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/bicep/environments/${{ inputs.environment }}/main.bicep \
            --parameters \
              environmentName=${{ inputs.environment }} \
              postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}'

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/bicep/environments/${{ inputs.environment }}/main.bicep \
            --parameters \
              environmentName=${{ inputs.environment }} \
              postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}'
