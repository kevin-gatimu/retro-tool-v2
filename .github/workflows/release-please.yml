# Automated lockstep releases.
#
# On every push to main, release-please parses the conventional-commit history
# and maintains a "release PR" that accumulates the changelog and version bump
# (feat → minor, fix → patch, feat!/BREAKING CHANGE → major). Merging that PR:
#   - bumps every package.json version (linked-versions keeps them in lockstep)
#   - updates CHANGELOG.md
#   - tags vX.Y.Z and creates the GitHub Release
#
# The tag does NOT trigger a deploy: release-please tags with the default
# GITHUB_TOKEN, and GitHub does not start workflow runs from GITHUB_TOKEN-authored
# events. Production is deployed by release-production.yml, which watches pushes
# to `main` (including the release-PR merge, so builds still get stamped with the
# released version).
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
