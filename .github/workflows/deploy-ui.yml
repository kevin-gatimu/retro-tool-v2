name: Deploy UI

on:
  push:
    branches: [main]
    paths:
      - 'retro-tool-ui/**'
      - 'packages/shared/contracts/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-ui-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────── Validate ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retro-tool-ui lint
      - run: pnpm --filter retro-tool-ui type-check
      - run: pnpm --filter retro-tool-ui test

  # ─────────────────── Determine target environment ───────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  # ──────── Build & Deploy to Azure Static Web App ────────────────────
  deploy:
    needs: [validate, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        env:
          VITE_APP_ENV: ${{ needs.set-env.outputs.environment }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_APP_TITLE: Retro Tool
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL }}
          VITE_ESTIMATES_REALTIME_BACKEND: ${{ vars.ESTIMATES_REALTIME_BACKEND || 'socket-io' }}
          VITE_RETROS_REALTIME_BACKEND: ${{ vars.RETROS_REALTIME_BACKEND || 'socket-io' }}
          VITE_NOTIFICATIONS_REALTIME_BACKEND: ${{ vars.NOTIFICATIONS_REALTIME_BACKEND || 'socket-io' }}
        run: pnpm --filter retro-tool-ui build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: retro-tool-ui/dist
          skip_app_build: true
          skip_api_build: true
