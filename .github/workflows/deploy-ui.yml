name: Deploy UI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-ui-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────── Validate ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retro-tool-ui lint
      - run: pnpm --filter retro-tool-ui type-check
      - run: pnpm --filter retro-tool-ui test

  # ───────────────────── Staging-only environment ─────────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: echo "environment=staging" >> "$GITHUB_OUTPUT"

  # ──────── Build & Deploy to Azure Static Web App ────────────────────
  deploy:
    needs: [validate, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required UI build config
        env:
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_ESTIMATES_REALTIME_BACKEND: ${{ vars.VITE_ESTIMATES_REALTIME_BACKEND }}
          VITE_RETROS_REALTIME_BACKEND: ${{ vars.VITE_RETROS_REALTIME_BACKEND }}
          VITE_ICEBREAKERS_REALTIME_BACKEND: ${{ vars.VITE_ICEBREAKERS_REALTIME_BACKEND }}
          VITE_STANDUPS_REALTIME_BACKEND: ${{ vars.VITE_STANDUPS_REALTIME_BACKEND }}
          VITE_NOTIFICATIONS_REALTIME_BACKEND: ${{ vars.VITE_NOTIFICATIONS_REALTIME_BACKEND }}
        run: |
          for key in \
            VITE_APP_TITLE \
            VITE_APP_ENV \
            VITE_API_URL \
            VITE_ESTIMATES_REALTIME_BACKEND \
            VITE_RETROS_REALTIME_BACKEND \
            VITE_ICEBREAKERS_REALTIME_BACKEND \
            VITE_STANDUPS_REALTIME_BACKEND \
            VITE_NOTIFICATIONS_REALTIME_BACKEND; do
            if [ -z "${!key}" ]; then
              echo "Required UI build variable is missing: ${key}"
              exit 1
            fi
          done

          USES_CONVEX=false
          for backend in "${VITE_ESTIMATES_REALTIME_BACKEND}" "${VITE_RETROS_REALTIME_BACKEND}" "${VITE_ICEBREAKERS_REALTIME_BACKEND}" "${VITE_STANDUPS_REALTIME_BACKEND}" "${VITE_NOTIFICATIONS_REALTIME_BACKEND}"; do
            [ "${backend}" = "convex" ] && USES_CONVEX=true && break
          done

          if [ "${USES_CONVEX}" = "true" ] && [ -z "${VITE_CONVEX_URL}" ]; then
            echo "VITE_CONVEX_URL is required when any realtime backend is set to 'convex'"
            exit 1
          fi

          case "${VITE_APP_ENV}" in
            local|development|staging|production) ;;
            *)
              echo "Invalid VITE_APP_ENV: ${VITE_APP_ENV}. Allowed: local|development|staging|production"
              exit 1
              ;;
          esac

          case "${VITE_ESTIMATES_REALTIME_BACKEND}" in
            socket-io|convex) ;;
            *)
              echo "Invalid VITE_ESTIMATES_REALTIME_BACKEND: ${VITE_ESTIMATES_REALTIME_BACKEND}. Allowed: socket-io|convex"
              exit 1
              ;;
          esac

          case "${VITE_RETROS_REALTIME_BACKEND}" in
            socket-io|convex) ;;
            *)
              echo "Invalid VITE_RETROS_REALTIME_BACKEND: ${VITE_RETROS_REALTIME_BACKEND}. Allowed: socket-io|convex"
              exit 1
              ;;
          esac

          case "${VITE_ICEBREAKERS_REALTIME_BACKEND}" in
            socket-io|convex) ;;
            *)
              echo "Invalid VITE_ICEBREAKERS_REALTIME_BACKEND: ${VITE_ICEBREAKERS_REALTIME_BACKEND}. Allowed: socket-io|convex"
              exit 1
              ;;
          esac

          case "${VITE_STANDUPS_REALTIME_BACKEND}" in
            socket-io|convex) ;;
            *)
              echo "Invalid VITE_STANDUPS_REALTIME_BACKEND: ${VITE_STANDUPS_REALTIME_BACKEND}. Allowed: socket-io|convex"
              exit 1
              ;;
          esac

          case "${VITE_NOTIFICATIONS_REALTIME_BACKEND}" in
            socket-io|convex) ;;
            *)
              echo "Invalid VITE_NOTIFICATIONS_REALTIME_BACKEND: ${VITE_NOTIFICATIONS_REALTIME_BACKEND}. Allowed: socket-io|convex"
              exit 1
              ;;
          esac

          node -e "
            new URL(process.env.VITE_API_URL);
            if (process.env.VITE_CONVEX_URL) new URL(process.env.VITE_CONVEX_URL);
            console.log('UI env URLs look valid');
          "

      - name: Resolve app version
        id: version
        run: echo "version=$(node -p "require('./retro-tool-ui/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build UI
        env:
          VITE_APP_VERSION: v${{ steps.version.outputs.version }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_ESTIMATES_REALTIME_BACKEND: ${{ vars.VITE_ESTIMATES_REALTIME_BACKEND }}
          VITE_RETROS_REALTIME_BACKEND: ${{ vars.VITE_RETROS_REALTIME_BACKEND }}
          VITE_ICEBREAKERS_REALTIME_BACKEND: ${{ vars.VITE_ICEBREAKERS_REALTIME_BACKEND }}
          VITE_STANDUPS_REALTIME_BACKEND: ${{ vars.VITE_STANDUPS_REALTIME_BACKEND }}
          VITE_NOTIFICATIONS_REALTIME_BACKEND: ${{ vars.VITE_NOTIFICATIONS_REALTIME_BACKEND }}
        run: pnpm --filter retro-tool-ui build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: retro-tool-ui/dist
          skip_app_build: true
          skip_api_build: true
