name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Fails the build on known-vulnerable dependencies (SECURITY-ASSESSMENT F11).
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the PR on known High/Critical advisories in production dependencies
      # (SECURITY-ASSESSMENT F11). Scoped to --prod so devDependency-only
      # advisories don't block merges; bump the threshold deliberately, not by
      # muting find