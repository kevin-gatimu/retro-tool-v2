name: Deploy API

on:
  push:
    branches: [main, staging]
    paths:
      - 'retro-tool-api/**'
      - 'packages/shared/contracts/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  IMAGE_NAME: retro-tool-api

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────── Validate ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retro-tool-api lint
      - run: pnpm --filter retro-tool-api type-check
      - run: pnpm --filter retro-tool-api test -- --runInBand
      - run: pnpm --filter retro-tool-api build

  # ─────────────────── Determine target environment ───────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────── Build & push Docker image ─────────────────────
  build-and-push:
    needs: [validate, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ needs.set-env.outputs.environment }}-${GITHUB_SHA::8}"
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./retro-tool-api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.set-env.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────── Run DB migrations ─────────────────────────────
  migrate:
    needs: [set-env, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run database migration via ACI
        run: |
          ENV="${{ needs.set-env.outputs.environment }}"
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          MIGRATION_NAME="retro-tool-${ENV}-migrate-$(date +%s)"
          ACR_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          ACR_USER="${{ vars.ACR_NAME }}"
          ACR_PWD=$(az acr credential show --name ${{ vars.ACR_NAME }} --query "passwords[0].value" -o tsv)

          # Run migration as a one-off container instance
          az container create \
            --resource-group "${RG}" \
            --name "${MIGRATION_NAME}" \
            --image "${IMAGE}" \
            --registry-login-server "${ACR_SERVER}" \
            --registry-username "${ACR_USER}" \
            --registry-password "${ACR_PWD}" \
            --environment-variables \
              NODE_ENV=production \
            --secure-environment-variables \
              DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            --command-line "node dist/migrate.js" \
            --restart-policy Never \
            --os-type Linux \
            --cpu 1 \
            --memory 1

          # Wait for completion (5 min timeout)
          for i in $(seq 1 60); do
            STATE=$(az container show --resource-group "${RG}" --name "${MIGRATION_NAME}" --query 'instanceView.state' -o tsv 2>/dev/null || echo "Unknown")
            if [ "$STATE" = "Succeeded" ]; then
              echo "Migration completed successfully"
              break
            elif [ "$STATE" = "Failed" ]; then
              echo "Migration failed!"
              az container logs --resource-group "${RG}" --name "${MIGRATION_NAME}"
              az container delete --resource-group "${RG}" --name "${MIGRATION_NAME}" --yes
              exit 1
            fi
            sleep 5
          done

          # Show logs
          az container logs --resource-group "${RG}" --name "${MIGRATION_NAME}"

          # Cleanup
          az container delete --resource-group "${RG}" --name "${MIGRATION_NAME}" --yes

  # ─────────────────────────── Deploy to App Service ──────────────────
  deploy:
    needs: [set-env, build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service environment variables
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --settings \
              NODE_ENV=production \
              PORT=8000 \
              FRONTEND_URL='${{ vars.SWA_URL }}' \
              ALLOWED_ORIGINS='${{ vars.SWA_URL }}' \
              LOCAL_SERVER_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              DEPLOYED_SERVER_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              CONVEX_SYNC_URL='${{ vars.CONVEX_SYNC_URL }}' \
              ENABLE_CRON_JOBS='true' \
              WEEKLY_DIGEST_SEND_HOUR='6' \
              BETTER_AUTH_SESSION_EXPIRES_IN='604800' \
              MICROSOFT_TENANT_ID='${{ vars.MICROSOFT_TENANT_ID || 'common' }}' \
              EMAIL_FROM='${{ vars.EMAIL_FROM }}' \
            --output none

      - name: Configure App Service secrets
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --settings \
              DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}' \
              BETTER_AUTH_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
              GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              MICROSOFT_CLIENT_ID='${{ secrets.AZURE_CLIENT_ID }}' \
              MICROSOFT_CLIENT_SECRET='${{ secrets.MICROSOFT_CLIENT_SECRET }}' \
              RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
              CONVEX_SYNC_ADMIN_KEY='${{ secrets.CONVEX_SYNC_ADMIN_KEY }}' \
              VAPID_PUBLIC_KEY='${{ secrets.VAPID_PUBLIC_KEY }}' \
              VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY }}' \
              VAPID_SUBJECT='${{ secrets.VAPID_SUBJECT }}' \
            --output none

      - name: Deploy image to App Service
        run: |
          az webapp config container set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --container-image-name ${{ needs.build-and-push.outputs.image }} \
            --container-registry-url https://${{ vars.ACR_LOGIN_SERVER }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }}

      - name: Health check
        run: |
          URL="https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Waiting for API to be healthy at ${URL}..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
