name: Deploy API

on:
  push:
    branches: [main, staging]
    paths:
      - 'retro-tool-api/**'
      - 'packages/shared/contracts/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────── Validate ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0-rc.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retro-tool-api lint
      - run: pnpm --filter retro-tool-api type-check
      - run: pnpm --filter retro-tool-api test:ci
      - run: pnpm --filter retro-tool-api build

  # ─────────────────── Determine target environment ───────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────── Build & package ───────────────────────────────
  build:
    needs: [validate, set-env]
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.pkg.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0-rc.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter retro-tool-api build

      - name: Package for deployment
        id: pkg
        run: |
          ARTIFACT="retro-tool-api-${{ needs.set-env.outputs.environment }}-${GITHUB_SHA::8}.zip"
          cd retro-tool-api
          # Include compiled output and production node_modules
          zip -r "../${ARTIFACT}" dist/ node_modules/ package.json
          echo "artifact-name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ${{ steps.pkg.outputs.artifact-name }}
          retention-days: 1

  # ──────────────────── Run DB migrations ─────────────────────────────
  migrate:
    needs: [set-env, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0-rc.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter retro-tool-api build

      - name: Run migrations
        working-directory: retro-tool-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: node dist/migrate.js

  # ─────────────────────────── Deploy to App Service ──────────────────
  deploy:
    needs: [set-env, build, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service environment variables
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --settings \
              NODE_ENV=production \
              PORT=8080 \
              FRONTEND_URL='${{ vars.SWA_URL }}' \
              ALLOWED_ORIGINS='${{ vars.SWA_URL }}' \
              LOCAL_SERVER_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              DEPLOYED_SERVER_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              CONVEX_SYNC_URL='${{ vars.CONVEX_SYNC_URL }}' \
              ENABLE_CRON_JOBS='true' \
              WEEKLY_DIGEST_SEND_HOUR='6' \
              BETTER_AUTH_SESSION_EXPIRES_IN='604800' \
              MICROSOFT_TENANT_ID='${{ vars.MICROSOFT_TENANT_ID || 'common' }}' \
              EMAIL_FROM='${{ vars.EMAIL_FROM }}' \
            --output none

      - name: Configure App Service secrets
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --settings \
              DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}' \
              BETTER_AUTH_URL='https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net' \
              GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
              GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              MICROSOFT_CLIENT_ID='${{ secrets.MICROSOFT_CLIENT_ID }}' \
              MICROSOFT_CLIENT_SECRET='${{ secrets.MICROSOFT_CLIENT_SECRET }}' \
              RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
              CONVEX_SYNC_ADMIN_KEY='${{ secrets.CONVEX_SYNC_ADMIN_KEY }}' \
              VAPID_PUBLIC_KEY='${{ secrets.VAPID_PUBLIC_KEY }}' \
              VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY }}' \
              VAPID_SUBJECT='${{ secrets.VAPID_SUBJECT }}' \
            --output none

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package

      - name: Deploy zip to App Service
        run: |
          ZIP=$(ls retro-tool-api-*.zip)
          az webapp deploy \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME }} \
            --src-path "${ZIP}" \
            --type zip \
            --async false

      - name: Health check
        run: |
          URL="https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Waiting for API to be healthy at ${URL}..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
