name: Deploy API

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'retro-tool-api/**'
      - 'packages/shared/contracts/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [develop, staging, production]

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────── Validate ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0-rc.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retro-tool-api lint
      - run: pnpm --filter retro-tool-api type-check
      - run: pnpm --filter retro-tool-api test:ci
      - run: pnpm --filter retro-tool-api build

  # ─────────────────── Determine target environment ───────────────────
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=develop" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────── Build & push image ────────────────────────────
  build:
    needs: [validate, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-name: ${{ steps.meta.outputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate container build config
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || secrets.ACR_LOGIN_SERVER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || secrets.API_IMAGE_REPOSITORY || 'retro-tool-api' }}
        run: |
          for key in ACR_LOGIN_SERVER API_IMAGE_REPOSITORY; do
            if [ -z "${!key}" ]; then
              echo "Required image build config is missing: ${key}"
              exit 1
            fi
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || secrets.ACR_LOGIN_SERVER }}
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr login --name "${ACR_NAME}"

      - name: Build and push API image
        id: meta
        env:
          TARGET_ENV: ${{ needs.set-env.outputs.environment }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || secrets.ACR_LOGIN_SERVER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || secrets.API_IMAGE_REPOSITORY || 'retro-tool-api' }}
        run: |
          IMAGE_TAG="${TARGET_ENV}-${GITHUB_SHA::8}"
          IMAGE_NAME="${ACR_LOGIN_SERVER}/${API_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${API_IMAGE_REPOSITORY}:${TARGET_ENV}-latest"

          docker build \
            --file retro-tool-api/Dockerfile \
            --tag "${IMAGE_NAME}" \
            --tag "${IMAGE_LATEST}" \
            .

          docker push "${IMAGE_NAME}"
          docker push "${IMAGE_LATEST}"

          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

  # ──────────────────── Run DB migrations ─────────────────────────────
  migrate:
    needs: [set-env, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0-rc.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter retro-tool-api build

      - name: Verify build entrypoint
        run: |
          test -f retro-tool-api/dist/main.js || {
            echo "Expected retro-tool-api/dist/main.js after build, but it is missing.";
            exit 1;
          }

      - name: Migration preflight
        working-directory: retro-tool-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          DB_HOST=$(node -e "const raw = process.env.DATABASE_URL || ''; if (!raw) { console.error('DATABASE_URL is missing'); process.exit(1); } try { const url = new URL(raw); process.stdout.write(url.hostname); } catch { console.error('DATABASE_URL is set but not a valid URL'); process.exit(1); }")
          DB_PORT=$(node -e "const url = new URL(process.env.DATABASE_URL); process.stdout.write(url.port || '5432')")

          echo "Migration target host: ${DB_HOST}:${DB_PORT}"

          if ! getent hosts "${DB_HOST}" > /dev/null; then
            echo "Database DNS lookup failed for ${DB_HOST}."
            echo "Check that DATABASE_URL uses the correct Flexible Server FQDN and that networking allows GitHub-hosted runners."
            echo "If the server is private access only, migrations must run from a VNet-connected runner/service instead of GitHub-hosted runners."
            exit 1
          fi

      - name: Run migrations
        working-directory: retro-tool-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm db:migrate

  # ─────────────────────────── Deploy to App Service ──────────────────
  deploy:
    needs: [set-env, build, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - name: Validate required deploy config
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          API_WEBAPP_NAME: ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || secrets.ACR_LOGIN_SERVER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || secrets.API_IMAGE_REPOSITORY || 'retro-tool-api' }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || vars.SWA_URL || secrets.FRONTEND_URL || secrets.SWA_URL }}
          CONVEX_SYNC_URL: ${{ vars.CONVEX_SYNC_URL || secrets.CONVEX_SYNC_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || vars.BETTER_AUTH_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || vars.MICROSOFT_CLIENT_ID || secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || vars.MICROSOFT_CLIENT_SECRET }}
          CONVEX_SYNC_ADMIN_KEY: ${{ secrets.CONVEX_SYNC_ADMIN_KEY || vars.CONVEX_SYNC_ADMIN_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || secrets.VAPID_SUBJECT }}
        run: |
          for key in AZURE_RESOURCE_GROUP API_WEBAPP_NAME ACR_LOGIN_SERVER API_IMAGE_REPOSITORY IMAGE_TAG FRONTEND_URL CONVEX_SYNC_URL EMAIL_FROM DATABASE_URL BETTER_AUTH_SECRET; do
            if [ -z "${!key}" ]; then
              echo "Required deploy config is missing: ${key}"
              exit 1
            fi
          done

          # Warn about optional secrets that are commonly misconfigured
          for key in CONVEX_SYNC_ADMIN_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "${!key}" ]; then
              echo "WARNING: ${key} is empty — check it exists in the '${{ needs.set-env.outputs.environment }}' environment as either a Variable or Secret."
            fi
          done

          validate_oauth_pair() {
            local provider="$1"
            local client_id_key="$2"
            local client_secret_key="$3"

            if [ -n "${!client_id_key}" ] && [ -z "${!client_secret_key}" ]; then
              echo "${provider} OAuth is partially configured: ${client_secret_key} is missing."
              exit 1
            fi

            if [ -z "${!client_id_key}" ] && [ -n "${!client_secret_key}" ]; then
              echo "${provider} OAuth is partially configured: ${client_id_key} is missing."
              exit 1
            fi
          }

          validate_oauth_pair "Microsoft" "MICROSOFT_CLIENT_ID" "MICROSOFT_CLIENT_SECRET"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service environment variables
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }} \
            --settings \
              NODE_ENV=production \
              PORT=8080 \
              FRONTEND_URL='${{ vars.FRONTEND_URL || vars.SWA_URL || secrets.FRONTEND_URL || secrets.SWA_URL }}' \
              ALLOWED_ORIGINS='${{ vars.FRONTEND_URL || vars.SWA_URL || secrets.FRONTEND_URL || secrets.SWA_URL }},https://${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}.azurewebsites.net' \
              LOCAL_SERVER_URL='https://${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}.azurewebsites.net' \
              DEPLOYED_SERVER_URL='https://${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}.azurewebsites.net' \
              CONVEX_SYNC_URL='${{ vars.CONVEX_SYNC_URL || secrets.CONVEX_SYNC_URL }}' \
              ENABLE_CRON_JOBS='true' \
              WEEKLY_DIGEST_SEND_HOUR='6' \
              BETTER_AUTH_SESSION_EXPIRES_IN='604800' \
              MICROSOFT_TENANT_ID='${{ vars.MICROSOFT_TENANT_ID || secrets.MICROSOFT_TENANT_ID || secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}' \
              EMAIL_FROM='${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}' \
            --output none

      - name: Configure App Service secrets
        run: |
          az webapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }} \
            --settings \
              DATABASE_URL='${{ secrets.DATABASE_URL || vars.DATABASE_URL }}' \
              BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET || vars.BETTER_AUTH_SECRET }}' \
              BETTER_AUTH_URL='https://${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}.azurewebsites.net' \
              MICROSOFT_CLIENT_ID='${{ secrets.MICROSOFT_CLIENT_ID || vars.MICROSOFT_CLIENT_ID || secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}' \
              MICROSOFT_CLIENT_SECRET='${{ secrets.MICROSOFT_CLIENT_SECRET || vars.MICROSOFT_CLIENT_SECRET }}' \
              RESEND_API_KEY='${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}' \
              CONVEX_SYNC_ADMIN_KEY='${{ secrets.CONVEX_SYNC_ADMIN_KEY || vars.CONVEX_SYNC_ADMIN_KEY }}' \
              VAPID_PUBLIC_KEY='${{ vars.VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}' \
              VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}' \
              VAPID_SUBJECT='${{ vars.VAPID_SUBJECT || secrets.VAPID_SUBJECT }}' \
            --output none

      - name: Verify ACR pull identity is configured
        run: |
          ACR_CREDS=$(az webapp config show \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }} \
            --query "acrUseManagedIdentityCreds" -o tsv)

          if [ "${ACR_CREDS}" != "true" ]; then
            echo "WARNING: acrUseManagedIdentityCreds is not enabled."
            echo "Ensure Bicep provisioning has run and configured the user-assigned managed identity with AcrPull."
            echo "Run: az deployment sub create --template-file infra/deploy.bicep --parameters infra/environments/<env>.bicepparam"
            exit 1
          fi
          echo "ACR pull via managed identity is configured."

      - name: Deploy container to App Service
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || secrets.ACR_LOGIN_SERVER }}
          API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || secrets.API_IMAGE_REPOSITORY || 'retro-tool-api' }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          IMAGE_NAME="${ACR_LOGIN_SERVER}/${API_IMAGE_REPOSITORY}:${IMAGE_TAG}"

          az webapp config container set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }} \
            --docker-custom-image-name "${IMAGE_NAME}" \
            --docker-registry-server-url "https://${ACR_LOGIN_SERVER}" \
            --output none

          az webapp restart \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }} \
            --output none

      - name: Health check
        run: |
          URL="https://${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Waiting for API to be healthy at ${URL}..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Collect Kudu runtime logs on failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        run: |
          APP_NAME="${{ vars.API_WEBAPP_NAME || secrets.API_WEBAPP_NAME }}"
          RG_NAME="${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}"
          LOG_ROOT="https://${APP_NAME}.scm.azurewebsites.net/api/logs/docker"

          echo "Deployment failed. Fetching Kudu runtime logs from ${LOG_ROOT}..."

          KUDU_USER=$(az webapp deployment list-publishing-credentials \
            --resource-group "${RG_NAME}" \
            --name "${APP_NAME}" \
            --query publishingUserName -o tsv 2>/dev/null)

          KUDU_PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group "${RG_NAME}" \
            --name "${APP_NAME}" \
            --query publishingPassword -o tsv 2>/dev/null)

          if [ -z "${KUDU_USER}" ] || [ -z "${KUDU_PASS}" ]; then
            echo "Could not retrieve Kudu publishing credentials."
            KUDU_HTTP_CODE="000"
          else
            KUDU_HTTP_CODE=$(curl -sS -u "${KUDU_USER}:${KUDU_PASS}" \
              -w '%{http_code}' -o kudu-docker-logs.zip "${LOG_ROOT}/zip" || true)
          fi

          if [ "${KUDU_HTTP_CODE}" = "200" ] && [ -s kudu-docker-logs.zip ]; then
            mkdir -p kudu-docker-logs
            unzip -o -q kudu-docker-logs.zip -d kudu-docker-logs || true

            echo "----- Kudu Docker logs (tail 200 lines per file) -----"
            find kudu-docker-logs -type f | while read -r file; do
              echo ""
              echo "### ${file}"
              tail -n 200 "${file}" || true
            done
          else
            echo "Kudu docker log download failed (HTTP ${KUDU_HTTP_CODE})."
            echo "If HTTP 401, SCM basic auth is likely disabled for this app."

            echo "----- Azure deployment logs (CLI) -----"
            az webapp log deployment show \
              --resource-group "${RG_NAME}" \
              --name "${APP_NAME}" || true

            echo "----- Azure webapp logs zip (CLI fallback) -----"
            az webapp log download \
              --resource-group "${RG_NAME}" \
              --name "${APP_NAME}" \
              --log-file webapp-logs.zip || true

            if [ -s webapp-logs.zip ]; then
              mkdir -p webapp-logs
              unzip -o -q webapp-logs.zip -d webapp-logs || true

              find webapp-logs -type f | while read -r file; do
                echo ""
                echo "### ${file}"
                tail -n 200 "${file}" || true
              done
            else
              echo "No webapp logs zip was produced by Azure CLI fallback."
            fi
          fi
