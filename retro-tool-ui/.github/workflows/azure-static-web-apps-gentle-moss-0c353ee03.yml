name: retro-tool-ui ci-cd (DEPRECATED)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: retro-tool-ui
  NODE_VERSION: '22'
  ACR_NAME: ''
  ACR_LOGIN_SERVER: ''
  AZURE_CLIENT_ID: ''
  AZURE_TENANT_ID: ''
  AZURE_SUBSCRIPTION_ID: ''
  AKS_RESOURCE_GROUP: ''
  AKS_CLUSTER_NAME: ''
  STAGING_API_URL: ''
  PRODUCTION_API_URL: ''

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export VITE_APP_ENV=production
            export VITE_API_URL='${{ env.PRODUCTION_API_URL }}'
          else
            export VITE_APP_ENV=staging
            export VITE_API_URL='${{ env.STAGING_API_URL }}'
          fi
          export VITE_APP_TITLE='Retro Tool'
          pnpm build

  publish-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      api_url: ${{ steps.image.outputs.api_url }}
      app_env: ${{ steps.image.outputs.app_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop if Azure placeholders are not configured
        if: env.AZURE_CLIENT_ID == '' || env.ACR_NAME == '' || env.ACR_LOGIN_SERVER == ''
        run: |
          echo "Configure Azure login and ACR values in this workflow before enabling deployment."
          exit 1

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENV_TAG=production
            APP_ENV=production
            API_URL='${{ env.PRODUCTION_API_URL }}'
          else
            ENV_TAG=staging
            APP_ENV=staging
            API_URL='${{ env.STAGING_API_URL }}'
          fi
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${ENV_TAG}-${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "app_env=${APP_ENV}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_ENV=${{ steps.image.outputs.app_env }}
            VITE_API_URL=${{ steps.image.outputs.api_url }}
            VITE_APP_TITLE=Retro Tool
          tags: ${{ steps.image.outputs.image }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Stop if AKS placeholders are not configured
        if: env.AKS_RESOURCE_GROUP == '' || env.AKS_CLUSTER_NAME == ''
        run: |
          echo "Configure AKS resource group and cluster values in this workflow before enabling deployment."
          exit 1

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy image to staging
        run: |
          kubectl -n retro-tool-staging set image deployment/retro-tool-ui retro-tool-ui=${{ needs.publish-image.outputs.image }}
          kubectl -n retro-tool-staging rollout status deployment/retro-tool-ui --timeout=180s

  deploy-production:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Stop if AKS placeholders are not configured
        if: env.AKS_RESOURCE_GROUP == '' || env.AKS_CLUSTER_NAME == ''
        run: |
          echo "Configure AKS resource group and cluster values in this workflow before enabling deployment."
          exit 1

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy image to production
        run: |
          kubectl -n retro-tool-production set image deployment/retro-tool-ui retro-tool-ui=${{ needs.publish-image.outputs.image }}
          kubectl -n retro-tool-production rollout status deployment/retro-tool-ui --timeout=180s
