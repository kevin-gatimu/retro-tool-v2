name: retro-tool-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  nest-api:
    build:
      context: ../retro-tool-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_local
      REDIS_URL: redis://redis:6379
      CONVEX_SYNC_URL: http://convex-backend:3210
      CONVEX_SYNC_ADMIN_KEY: ''
      PORT: 8000
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    environment:
      INSTANCE_NAME: convex-local
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432
      DO_NOT_REQUIRE_SSL: '1'
    depends_on:
      - postgres
    ports:
      - '3210:3210'
      - '3211:3211'

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    depends_on:
      - convex-backend
    ports:
      - '6791:6791'

  ui:
    build:
      context: ../retro-tool-ui
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: development
        VITE_API_URL: http://localhost:8000
        VITE_APP_TITLE: Retro Tool
    depends_on:
      - nest-api
    ports:
      - '3000:80'

volumes:
  postgres-data: