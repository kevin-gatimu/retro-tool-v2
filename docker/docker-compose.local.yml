name: retro-tool-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - retro-tool-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  nest-api:
    build:
      context: ../retro-tool-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SESSION_EXPIRES_IN: ${BETTER_AUTH_SESSION_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      LOCAL_SERVER_URL: ${LOCAL_SERVER_URL}
      DEPLOYED_SERVER_URL: ${DEPLOYED_SERVER_URL}
      CONVEX_SYNC_URL: ${CONVEX_SYNC_URL}
      CONVEX_SYNC_ADMIN_KEY: ${CONVEX_SYNC_ADMIN_KEY}
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS}
      WEEKLY_DIGEST_SEND_HOUR: ${WEEKLY_DIGEST_SEND_HOUR}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT}:8000"

  convex-backend:
    image: ghcr.io/get-convex/convex-backend@sha256:1738f1673f8d63161043a7859710d2301b1e9d6271e06afbb7af31594ea3a58f
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET}
      POSTGRES_URL: ${CONVEX_POSTGRES_URL}
      DO_NOT_REQUIRE_SSL: ${CONVEX_DO_NOT_REQUIRE_SSL}
      DISABLE_BEACON: ${DISABLE_BEACON:-1}
      CONVEX_BETTER_AUTH_URL: ${CONVEX_BETTER_AUTH_URL}
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONVEX_API_PORT}:3210"
      - "${CONVEX_SITE_PORT}:3211"
    volumes:
      - retro-tool-convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    depends_on:
      - convex-backend
    ports:
      - "${CONVEX_DASHBOARD_PORT}:6791"

  ui:
    build:
      context: ..
      dockerfile: retro-tool-ui/Dockerfile
      args:
        VITE_APP_ENV: ${VITE_APP_ENV}
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_TITLE: ${VITE_APP_TITLE}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_ESTIMATES_REALTIME_BACKEND: ${VITE_ESTIMATES_REALTIME_BACKEND}
        VITE_RETROS_REALTIME_BACKEND: ${VITE_RETROS_REALTIME_BACKEND}
        VITE_ICEBREAKERS_REALTIME_BACKEND: ${VITE_ICEBREAKERS_REALTIME_BACKEND}
        VITE_STANDUPS_REALTIME_BACKEND: ${VITE_STANDUPS_REALTIME_BACKEND}
        VITE_NOTIFICATIONS_REALTIME_BACKEND: ${VITE_NOTIFICATIONS_REALTIME_BACKEND}
    depends_on:
      - nest-api
    ports:
      - "${UI_PORT}:80"

volumes:
  retro-tool-postgres-data:
  retro-tool-convex-data:
