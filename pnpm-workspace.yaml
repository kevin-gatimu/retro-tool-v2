packages:
  - 'retro-tool-api'
  - 'retro-tool-ui'
  - 'convex-backend'
  - 'packages/*/*'
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  core-js: set this to true or false
  esbuild: true
  lightningcss: true
  unrs-resolver: true
managePackageManagerVersions: false
minimumReleaseAge: 0

resolutionMode: highest
